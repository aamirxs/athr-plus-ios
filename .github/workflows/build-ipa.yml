name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package Athr+ IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install & Run XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          cd AthrPlus
          xcodegen generate

      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project AthrPlus/AthrPlus.xcodeproj \
            -scheme AthrPlus \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/AthrPlus.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/AthrPlus.xcarchive/Products/Applications/*.app Payload/
          
          # Inspect and ensure every .appex has a valid NSExtension dictionary in Info.plist
          for appex in Payload/*.app/PlugIns/*.appex; do
            if [ -d "$appex" ]; then
              echo "=== Checking Info.plist for app extension: $appex ==="
              plutil -p "$appex/Info.plist" || true
              if ! plutil -extract NSExtension xml1 -o - "$appex/Info.plist" > /dev/null 2>&1; then
                echo "WARNING: NSExtension missing! Injecting into $appex/Info.plist..."
                plutil -insert NSExtension -xml "<dict><key>NSExtensionPointIdentifier</key><string>com.apple.widgetkit-extension</string></dict>" "$appex/Info.plist"
              else
                echo "OK: NSExtension dictionary is present in $appex/Info.plist"
              fi
              echo "=== Verified $appex/Info.plist content: ==="
              plutil -p "$appex/Info.plist"
            fi
          done

          zip -qr AthrPlus.ipa Payload
          ls -lh AthrPlus.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AthrPlus.ipa
          path: AthrPlus.ipa
          retention-days: 14

      - name: Publish GitHub Release (Tagged Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AthrPlus.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
