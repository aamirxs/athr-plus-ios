name: AthrPlus
options:
  bundleIdPrefix: plus.athr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  AthrPlus:
    type: application
    platform: iOS
    sources:
      - path: AthrPlus
        excludes:
          - "Info.plist"
          - "*.entitlements"
    entitlements:
      path: AthrPlus/AthrPlus.entitlements
    info:
      path: AthrPlus/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: plus.athr.ios
      PRODUCT_NAME: Athr+
      TARGETED_DEVICE_FAMILY: "1,2"
      CURRENT_PROJECT_VERSION: "4"
      MARKETING_VERSION: "1.0.3"
      DEVELOPMENT_ASSET_PATHS: "AthrPlus/Assets.xcassets"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_PREVIEWS: YES
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: AthrPlus/Info.plist
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: AthrPlusWidget

  AthrPlusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AthrPlusWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: AthrPlus/Utilities/Constants.swift
      - path: AthrPlus/API/APIModels.swift
      - path: AthrPlus/Data/Preferences.swift
    entitlements:
      path: AthrPlusWidget/AthrPlusWidget.entitlements
    info:
      path: AthrPlusWidget/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: plus.athr.ios.widget
      PRODUCT_NAME: Athr+ Widget
      TARGETED_DEVICE_FAMILY: "1,2"
      CURRENT_PROJECT_VERSION: "4"
      MARKETING_VERSION: "1.0.3"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: AthrPlusWidget/Info.plist

  AthrPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AthrPlusTests
    dependencies:
      - target: AthrPlus
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: plus.athr.ios.tests
      TARGETED_DEVICE_FAMILY: "1,2"
